; Isolated config for the integration suite — do NOT inherit the unit suite's
; pyproject settings (coverage gate, warnings-as-errors, viur-light-mock).
; Run from the repo root:  python -m pytest -c integration/pytest.ini integration
[pytest]
testpaths = .
addopts = -ra
; viur-core pulls the appengine stack, which emits SyntaxWarnings on import.
; The unit suite turns warnings into errors; here we must not.
filterwarnings =
    ignore
