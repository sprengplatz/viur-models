name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-cov 'coverage[toml]' 'spltz-viur-light-mock>=0.3,<1.0' 'viur-core>=3.8,<3.9' 'spltz-viur-actions>=0.4,<1.0' sqlmodel pydantic-extra-types pycountry email-validator 'alembic>=1.13'

      - name: Run tests with 100% coverage gate
        run: pytest

      - name: Upload coverage HTML
        if: matrix.python == '3.13' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  package:
    name: Build & validate distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Assert version matches CHANGELOG
        run: |
          PKG=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/viur/models/__init__.py)
          test -n "$PKG" || { echo "::error::__version__ not found in src/viur/models/__init__.py"; exit 1; }
          echo "Package version: $PKG"
          if ! grep -q "^## \[$PKG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PKG]' section for the current __version__"
            exit 1
          fi

  integration:
    # integration/ against the real viur-core, no viur-light-mock.
    name: Integration (py ${{ matrix.python }}, viur-core ${{ matrix.viur-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        viur-core: [">=3.8,<3.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install viur-core + viur-models
        run: |
          python -m pip install --upgrade pip
          python -m pip install "viur-core${{ matrix.viur-core }}" rsa pytest 'spltz-viur-actions>=0.4,<1.0' sqlmodel pydantic-extra-types pycountry email-validator 'alembic>=1.13'
          python -m pip install --no-deps -e .

      - name: Run integration suite (real core, isolated config)
        run: python -m pytest -c integration/pytest.ini integration
