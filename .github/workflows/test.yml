name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (overlay mode — real viur-core, in-memory datastore)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-cov 'coverage[toml]' 'spltz-viur-light-mock[overlay]>=0.3,<1.0' 'spltz-viur-actions>=0.4,<1.0' sqlmodel pydantic-extra-types pycountry email-validator 'alembic>=1.13'

      - name: Run tests with 100% coverage gate
        run: pytest

      - name: Upload coverage HTML
        if: matrix.python == '3.13' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  package:
    name: Build & validate distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Assert version matches CHANGELOG
        run: |
          PKG=$(python -c "import re; t=open('src/viur/models/__init__.py').read(); print(re.search(r'__version__ = [\"\\'']([^\"\\'']+)[\"\\'']', t).group(1))")
          echo "Package version: $PKG"
          if ! grep -q "^## \[$PKG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PKG]' section for the current __version__"
            exit 1
          fi

  integration:
    # Runs the integration/ suite against a REAL viur-core (no viur-light-mock),
    # so the package is validated against the actual framework. Bump the
    # viur-core spec in the matrix to widen coverage across 3.8.x.
    name: Integration (py ${{ matrix.python }}, viur-core ${{ matrix.viur-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        viur-core: [">=3.8,<4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install real viur-core + viur-models (NOT viur-light-mock)
        run: |
          python -m pip install --upgrade pip
          # rsa is a transitive dep of the appengine testbed that viur-core
          # imports at load time but does not pin.
          python -m pip install "viur-core${{ matrix.viur-core }}" rsa pytest 'spltz-viur-actions>=0.4,<1.0' sqlmodel pydantic-extra-types pycountry email-validator 'alembic>=1.13'
          python -m pip install --no-deps -e .

      - name: Run integration suite (real core, isolated config)
        run: python -m pytest -c integration/pytest.ini integration
