[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viur-models"
dynamic = ["version"]
description = "SQLmodel definitions for ViUR applications."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Andreas H. Kelch" },
]
keywords = ["viur", "models", "skeletons", "bones"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: ViUR",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "viur-core>=3.8,<4",
    "viur-actions>=0.2",
    "sqlmodel>=0.0.39",
    "pydantic-extra-types>=2.10",
    "pycountry>=24.6",
    "email-validator>=2",
]

[project.optional-dependencies]
test = [
    "pytest~=8.0",
    "pytest-cov~=5.0",
    "coverage[toml]~=7.0",
    "viur-light-mock>=0.1",
]
docs = [
    "mkdocs-material~=9.5",
    "mkdocstrings[python]~=0.26",
]
dev = [
    "viur-models[test,docs]",
    "build~=1.2",
]

[project.urls]
Homepage = "https://github.com/sprengplatz/viur-models"
Repository = "https://github.com/sprengplatz/viur-models.git"
"Bug Tracker" = "https://github.com/sprengplatz/viur-models/issues"
Changelog = "https://github.com/sprengplatz/viur-models/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "viur.models.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["viur.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=viur.models",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=100",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["viur.models"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if t\\.TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
